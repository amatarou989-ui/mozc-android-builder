name: Build Mozc for Android with corrected SudachiDict

on:
  workflow_dispatch:
    inputs:
      mozc_ref:
        description: "Mozcのブランチ、タグ、またはコミットID"
        required: true
        default: "3f235b4eb6fcff7d14ef5f0fb8ee56de7ee4c732"
        type: string
      sudachi_ref:
        description: "mozcdic-ut-sudachidictのブランチ、タグ、またはコミットID"
        required: true
        default: "c686771bada1d59e9b105c81b29e6ac1a239cb54"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android Mozc with corrected SudachiDict
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Builder本体を取得
        uses: actions/checkout@v6
        with:
          path: builder
          fetch-depth: 1

      - name: Mozcソースを取得
        uses: actions/checkout@v6
        with:
          repository: google/mozc
          ref: ${{ inputs.mozc_ref }}
          path: mozc
          fetch-depth: 1

      - name: Sudachi追加辞書を取得
        uses: actions/checkout@v6
        with:
          repository: utuhiro78/mozcdic-ut-sudachidict
          ref: ${{ inputs.sudachi_ref }}
          path: mozcdic-ut-sudachidict
          fetch-depth: 1

      - name: Python 3.12を準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 基本ビルドツールを準備
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bzip2 \
            clang \
            curl \
            file \
            unzip \
            zip

          if ! command -v bazelisk >/dev/null 2>&1; then
            curl -fL \
              -o /tmp/bazelisk \
              https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64

            chmod +x /tmp/bazelisk
            sudo mv /tmp/bazelisk /usr/local/bin/bazelisk
          fi

          python3 --version
          clang --version
          bazelisk version

      - name: Mozcの追加依存関係を取得
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail
          python3 build_tools/update_deps.py

      - name: 出力フォルダを作成
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/mozc-android-output"

      - name: Builderスクリプトをテスト
        shell: bash
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/builder/tools/test_patch_sudachi_dictionary.py"
          PYTHONPATH="$GITHUB_WORKSPACE/builder/tools" \
            python3 -m unittest -v \
              test_build_sudachi_word_cost \
              test_patch_mozc_candidate_metadata

      - name: Mozc候補ランキングメタデータを有効化
        shell: bash
        run: |
          set -euxo pipefail

          OUTPUT="$GITHUB_WORKSPACE/mozc-android-output"
          PATCHER="$GITHUB_WORKSPACE/builder/tools/patch_mozc_candidate_metadata.py"
          FIELD_MAP="$GITHUB_WORKSPACE/builder/data/futatsumugi_candidate_metadata_fields.tsv"
          REPORT="$OUTPUT/MOZC_CANDIDATE_METADATA_PATCH.txt"

          test -s "$PATCHER"
          test -s "$FIELD_MAP"

          python3 "$PATCHER" \
            --mozc-src "$GITHUB_WORKSPACE/mozc/src" \
            --report "$REPORT"

          grep -Fx "result=SUCCESS" "$REPORT"
          grep -F "candidate_word_private_fields=200-211" "$REPORT"
          grep -F "futatsumugi_structure_cost" \
            "$GITHUB_WORKSPACE/mozc/src/protocol/candidate_window.proto"
          grep -F "set_futatsumugi_structure_cost" \
            "$GITHUB_WORKSPACE/mozc/src/session/internal/session_output.cc"

          cp "$FIELD_MAP" "$OUTPUT/futatsumugi_candidate_metadata_fields.tsv"

          # LID/RIDの数値を品詞名へ引けるよう、今回のMozc refそのもののid.defも保存する。
          POS_ID_DEF="$GITHUB_WORKSPACE/mozc/src/data/dictionary_oss/id.def"
          test -s "$POS_ID_DEF"
          cp "$POS_ID_DEF" "$OUTPUT/mozc_pos_id.def"

          cat "$REPORT"

      - name: Sudachi辞書へ確認済み補正を適用
        shell: bash
        run: |
          set -euxo pipefail

          OUTPUT="$GITHUB_WORKSPACE/mozc-android-output"
          ARCHIVE="$GITHUB_WORKSPACE/mozcdic-ut-sudachidict/mozcdic-ut-sudachidict.txt.bz2"
          ORIGINAL="$RUNNER_TEMP/mozcdic-ut-sudachidict-original.txt"
          CORRECTED="$RUNNER_TEMP/mozcdic-ut-sudachidict-corrected.txt"
          RULES="$GITHUB_WORKSPACE/builder/data/sudachi_dictionary_corrections.tsv"
          PATCHER="$GITHUB_WORKSPACE/builder/tools/patch_sudachi_dictionary.py"
          REPORT="$OUTPUT/SUDACHI_CORRECTION_REPORT.tsv"
          SUMMARY="$OUTPUT/SUDACHI_CORRECTION_SUMMARY.txt"
          MOZC_DICTIONARY="$GITHUB_WORKSPACE/mozc/src/data/dictionary_oss/dictionary00.txt"

          test -s "$ARCHIVE"
          test -s "$RULES"
          test -s "$PATCHER"
          test -s "$MOZC_DICTIONARY"

          bzip2 -dc "$ARCHIVE" > "$ORIGINAL"
          sed -i 's/\r$//' "$ORIGINAL"
          test -s "$ORIGINAL"

          # 補正判定で停止した場合も、元辞書・ルール・診断結果をArtifactsへ残す。
          cp "$RULES" "$OUTPUT/sudachi_dictionary_corrections.tsv"
          bzip2 -c "$ORIGINAL" \
            > "$OUTPUT/mozcdic-ut-sudachidict-original.txt.bz2"
          bzip2 -c "$MOZC_DICTIONARY" \
            > "$OUTPUT/dictionary00-original.txt.bz2"

          python3 "$PATCHER" \
            --input "$ORIGINAL" \
            --rules "$RULES" \
            --output "$CORRECTED" \
            --report "$REPORT" \
            --summary "$SUMMARY"

          test -s "$CORRECTED"
          test -s "$REPORT"
          test -s "$SUMMARY"
          grep -Fx "result=SUCCESS" "$SUMMARY"

          awk -F '\t' '
            NF != 5 {
              invalid += 1
              if (invalid <= 10) {
                print "不正な辞書行 " NR ": " $0 > "/dev/stderr"
              }
            }
            END {
              print "Corrected Sudachi dictionary entries: " NR
              print "Invalid entries: " (invalid + 0)
              exit invalid > 0
            }
          ' "$CORRECTED"

          bzip2 -c "$CORRECTED" \
            > "$OUTPUT/mozcdic-ut-sudachidict-corrected.txt.bz2"

          # 補正済みSudachi辞書の reading + surface + cost を、Androidで直接二分探索できる
          # 専用バイナリへ変換する。Mozcへ結合する前のSudachi由来行だけを対象にする。
          SUDACHI_COMMIT_ID="$(git -C "$GITHUB_WORKSPACE/mozcdic-ut-sudachidict" rev-parse HEAD)"
          python3 "$GITHUB_WORKSPACE/builder/tools/build_sudachi_word_cost.py" \
            --input "$CORRECTED" \
            --output-bin "$OUTPUT/sudachi_word_cost_v1.bin" \
            --output-tsv "$OUTPUT/sudachi_word_cost_v1.tsv" \
            --manifest "$OUTPUT/SUDACHI_WORD_COST_MANIFEST.json" \
            --source-ref "${{ inputs.sudachi_ref }}" \
            --source-commit "$SUDACHI_COMMIT_ID"

          test -s "$OUTPUT/sudachi_word_cost_v1.bin"
          test -s "$OUTPUT/sudachi_word_cost_v1.tsv"
          test -s "$OUTPUT/SUDACHI_WORD_COST_MANIFEST.json"

          BEFORE_LINES="$(wc -l < "$MOZC_DICTIONARY")"
          ADDED_LINES="$(wc -l < "$CORRECTED")"

          cat "$CORRECTED" >> "$MOZC_DICTIONARY"

          AFTER_LINES="$(wc -l < "$MOZC_DICTIONARY")"
          test "$AFTER_LINES" -eq "$((BEFORE_LINES + ADDED_LINES))"

          bzip2 -c "$MOZC_DICTIONARY" \
            > "$OUTPUT/dictionary00-merged-corrected.txt.bz2"

          echo "Mozc dictionary before merge: $BEFORE_LINES"
          echo "Corrected Sudachi dictionary added: $ADDED_LINES"
          echo "Mozc dictionary after merge: $AFTER_LINES"

          echo "=== 重要補正結果 ==="
          grep -F $'あべないかく\t' "$CORRECTED" | grep -F $'\t安倍内閣' || true
          if grep -F $'あべしんぞうないかく\t' "$CORRECTED" | grep -Fq $'\t安倍内閣'; then
            echo "::error::安倍内閣の誤読が残っています"
            exit 1
          fi

          grep -F $'いわてけんりつはなまきみなみこうとうがっこう\t' "$CORRECTED" \
            | grep -F $'\t岩手県立花巻南高等学校'
          grep -F $'じょうほうじゃくしゃむけびじねす\t' "$CORRECTED" \
            | grep -F $'\t情報弱者向けビジネス'

          cat "$SUMMARY"
          cat "$REPORT"

      - name: Zero Query入力データを確認
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail

          test -s data/zero_query/zero_query.def
          test -s data/zero_query/zero_query_number.def
          test -s data_manager/oss/BUILD.bazel

          grep -n "zero_query_def" data_manager/oss/BUILD.bazel
          grep -n "zero_query_number_def" data_manager/oss/BUILD.bazel

          wc -l -c data/zero_query/zero_query.def
          wc -l -c data/zero_query/zero_query_number.def

      - name: Mozc辞書データをビルド
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail

          bazelisk build \
            //data_manager/oss:mozc_dataset_for_oss \
            --config release_build

          DATA_FILE="bazel-bin/data_manager/oss/mozc.data"
          test -s "$DATA_FILE"

          cp -L \
            "$DATA_FILE" \
            "$GITHUB_WORKSPACE/mozc-android-output/mozc.data"

          file "$DATA_FILE"
          ls -lh "$DATA_FILE"

      - name: Android用libmozc.soをビルド
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail

          bazelisk build \
            package \
            --config oss_android \
            --config release_build

          NATIVE_ZIP="bazel-bin/android/jni/native_libs.zip"
          test -s "$NATIVE_ZIP"

          cp -L \
            "$NATIVE_ZIP" \
            "$GITHUB_WORKSPACE/mozc-android-output/native_libs.zip"

      - name: ネイティブライブラリを展開
        shell: bash
        run: |
          set -euxo pipefail

          OUTPUT="$GITHUB_WORKSPACE/mozc-android-output"

          mkdir -p "$OUTPUT/native_libs"
          unzip -q "$OUTPUT/native_libs.zip" -d "$OUTPUT/native_libs"

          LIBRARY_COUNT="$(
            find "$OUTPUT/native_libs" \
              -type f \
              -name "libmozc.so" \
              | wc -l
          )"
          test "$LIBRARY_COUNT" -gt 0

          find "$OUTPUT/native_libs" \
            -type f \
            -name "libmozc.so" \
            -print \
            -exec file {} \; \
            -exec ls -lh {} \;

      - name: バージョン・補正情報・ライセンスを保存
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail

          OUTPUT="$GITHUB_WORKSPACE/mozc-android-output"
          MOZC_COMMIT_ID="$(git rev-parse HEAD)"
          MOZC_COMMIT_DATE="$(git log -1 --format='%cs')"
          MOZC_COMMIT_SUBJECT="$(git log -1 --format='%s')"
          SUDACHI_REPOSITORY="$GITHUB_WORKSPACE/mozcdic-ut-sudachidict"
          SUDACHI_COMMIT_ID="$(git -C "$SUDACHI_REPOSITORY" rev-parse HEAD)"
          SUDACHI_COMMIT_DATE="$(git -C "$SUDACHI_REPOSITORY" log -1 --format='%cs')"
          SUDACHI_COMMIT_SUBJECT="$(git -C "$SUDACHI_REPOSITORY" log -1 --format='%s')"
          RULE_SHA256="$(
            sha256sum "$GITHUB_WORKSPACE/builder/data/sudachi_dictionary_corrections.tsv" \
              | awk '{print $1}'
          )"

          {
            echo "Mozc requested ref:"
            echo "${{ inputs.mozc_ref }}"
            echo
            echo "Mozc commit:"
            echo "$MOZC_COMMIT_ID"
            echo "$MOZC_COMMIT_DATE"
            echo "$MOZC_COMMIT_SUBJECT"
            echo
            echo "Sudachi dictionary requested ref:"
            echo "${{ inputs.sudachi_ref }}"
            echo
            echo "Sudachi dictionary commit:"
            echo "$SUDACHI_COMMIT_ID"
            echo "$SUDACHI_COMMIT_DATE"
            echo "$SUDACHI_COMMIT_SUBJECT"
            echo
            echo "Sudachi correction rules SHA-256:"
            echo "$RULE_SHA256"
            echo
            echo "Sudachi correction summary:"
            cat "$OUTPUT/SUDACHI_CORRECTION_SUMMARY.txt"
            echo
            echo "Sudachi word-cost ranking asset:"
            echo "sudachi_word_cost_v1.bin"
            echo "Key: Unicode NFKC(reading) + U+001F + Unicode NFKC(surface)"
            echo "Value: minimum signed dictionary cost (lower = stronger dictionary preference)"
            echo "岩手県立花巻南高等学校は完全読み1件だけを維持"
            echo "情報弱者向けビジネスは完全読み1件だけを維持"
            echo
            echo "Sudachi dictionary repository:"
            echo "utuhiro78/mozcdic-ut-sudachidict"
            echo
            echo "Sudachi dictionary license:"
            echo "Apache License 2.0"
            echo
            echo "Futatsumugi CandidateWord ranking metadata:"
            echo "Private proto fields: 200-211"
            echo "lid/rid/cost/wcost/structure_cost/content_key/content_value/raw_attributes/source_info/consumed_key_size/inner_segment_boundary/cost_before_rescoring"
            echo "Standard CandidateWord id/index/key/value/attributes/num_segments_in_candidate remain unchanged."
            echo "POS ID map artifact: mozc_pos_id.def (same Mozc ref: data/dictionary_oss/id.def)"
            echo
            cat "$OUTPUT/MOZC_CANDIDATE_METADATA_PATCH.txt"
            echo
            echo "Dataset target:"
            echo "//data_manager/oss:mozc_dataset_for_oss"
          } > "$OUTPUT/MOZC_BUILD_INFO.txt"

          cp ../LICENSE "$OUTPUT/MOZC_LICENSE.txt"
          cp "$SUDACHI_REPOSITORY/LICENSE" \
            "$OUTPUT/SUDACHI_DICTIONARY_LICENSE.txt"
          cp data/zero_query/zero_query.def "$OUTPUT/zero_query.def"
          cp data/zero_query/zero_query_number.def \
            "$OUTPUT/zero_query_number.def"

      - name: 成果物を検査
        shell: bash
        run: |
          set -euxo pipefail

          OUTPUT="$GITHUB_WORKSPACE/mozc-android-output"
          cd "$OUTPUT"

          test -s native_libs.zip
          test -s mozc.data
          test -s zero_query.def
          test -s zero_query_number.def
          test -s MOZC_BUILD_INFO.txt
          test -s MOZC_LICENSE.txt
          test -s SUDACHI_DICTIONARY_LICENSE.txt
          test -s SUDACHI_CORRECTION_REPORT.tsv
          test -s SUDACHI_CORRECTION_SUMMARY.txt
          test -s sudachi_dictionary_corrections.tsv
          test -s dictionary00-original.txt.bz2
          test -s mozcdic-ut-sudachidict-original.txt.bz2
          test -s mozcdic-ut-sudachidict-corrected.txt.bz2
          test -s dictionary00-merged-corrected.txt.bz2
          test -s sudachi_word_cost_v1.bin
          test -s sudachi_word_cost_v1.tsv
          test -s SUDACHI_WORD_COST_MANIFEST.json
          test -s MOZC_CANDIDATE_METADATA_PATCH.txt
          test -s futatsumugi_candidate_metadata_fields.tsv
          test -s mozc_pos_id.def

          grep -Fx "result=SUCCESS" MOZC_CANDIDATE_METADATA_PATCH.txt
          unzip -t native_libs.zip
          file mozc.data

          sha256sum \
            native_libs.zip \
            mozc.data \
            zero_query.def \
            zero_query_number.def \
            MOZC_BUILD_INFO.txt \
            MOZC_LICENSE.txt \
            SUDACHI_DICTIONARY_LICENSE.txt \
            SUDACHI_CORRECTION_REPORT.tsv \
            SUDACHI_CORRECTION_SUMMARY.txt \
            sudachi_dictionary_corrections.tsv \
            dictionary00-original.txt.bz2 \
            mozcdic-ut-sudachidict-original.txt.bz2 \
            mozcdic-ut-sudachidict-corrected.txt.bz2 \
            dictionary00-merged-corrected.txt.bz2 \
            sudachi_word_cost_v1.bin \
            sudachi_word_cost_v1.tsv \
            SUDACHI_WORD_COST_MANIFEST.json \
            MOZC_CANDIDATE_METADATA_PATCH.txt \
            futatsumugi_candidate_metadata_fields.tsv \
            mozc_pos_id.def \
            > SHA256SUMS.txt

          cat MOZC_BUILD_INFO.txt
          cat SUDACHI_CORRECTION_SUMMARY.txt
          cat SUDACHI_CORRECTION_REPORT.tsv
          cat SHA256SUMS.txt

      - name: 成果物または診断ファイルをアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mozc-android-sudachi-corrected-${{ github.run_number }}
          path: mozc-android-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
