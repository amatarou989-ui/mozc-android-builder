name: Build Mozc for Android with SudachiDict

on:
  workflow_dispatch:
    inputs:
      mozc_ref:
        description: "Mozcのブランチ、タグ、またはコミットID"
        required: true
        default: "3f235b4eb6fcff7d14ef5f0fb8ee56de7ee4c732"
        type: string
      sudachi_ref:
        description: "mozcdic-ut-sudachidictのブランチ、タグ、またはコミットID"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android Mozc with SudachiDict
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Mozcソースを取得
        uses: actions/checkout@v6
        with:
          repository: google/mozc
          ref: ${{ inputs.mozc_ref }}
          path: mozc
          fetch-depth: 1

      - name: Sudachi追加辞書を取得
        uses: actions/checkout@v6
        with:
          repository: utuhiro78/mozcdic-ut-sudachidict
          ref: ${{ inputs.sudachi_ref }}
          path: mozcdic-ut-sudachidict
          fetch-depth: 1

      - name: Python 3.12を準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 基本ビルドツールを準備
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bzip2 \
            clang \
            curl \
            file \
            unzip \
            zip

          if ! command -v bazelisk >/dev/null 2>&1; then
            curl -fL \
              -o /tmp/bazelisk \
              https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64

            chmod +x /tmp/bazelisk
            sudo mv /tmp/bazelisk /usr/local/bin/bazelisk
          fi

          python3 --version
          clang --version
          bazelisk version

      - name: Mozcの追加依存関係を取得
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail
          python3 build_tools/update_deps.py

      - name: Sudachi辞書をMozcへ追加
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/mozcdic-ut-sudachidict/mozcdic-ut-sudachidict.txt.bz2"
          EXPANDED="$RUNNER_TEMP/mozcdic-ut-sudachidict.txt"
          MOZC_DICTIONARY="$GITHUB_WORKSPACE/mozc/src/data/dictionary_oss/dictionary00.txt"

          test -s "$ARCHIVE"
          test -s "$MOZC_DICTIONARY"

          bzip2 -dc "$ARCHIVE" > "$EXPANDED"
          sed -i 's/\r$//' "$EXPANDED"
          test -s "$EXPANDED"

          awk -F '\t' '
            NF == 0 { next }
            NF != 5 {
              invalid += 1
              if (invalid <= 10) {
                print "不正な辞書行 " NR ": " $0 > "/dev/stderr"
              }
            }
            END {
              print "Sudachi dictionary entries: " NR
              print "Invalid entries: " invalid
              exit invalid > 0
            }
          ' "$EXPANDED"

          BEFORE_LINES="$(wc -l < "$MOZC_DICTIONARY")"
          ADDED_LINES="$(wc -l < "$EXPANDED")"

          cat "$EXPANDED" >> "$MOZC_DICTIONARY"

          AFTER_LINES="$(wc -l < "$MOZC_DICTIONARY")"
          test "$AFTER_LINES" -gt "$BEFORE_LINES"

          echo "Mozc dictionary before: $BEFORE_LINES"
          echo "Sudachi dictionary added: $ADDED_LINES"
          echo "Mozc dictionary after: $AFTER_LINES"

          echo "=== 代表語彙の収録確認（見つからなくてもビルドは継続） ==="
          grep -F -m 5 "鬼滅の刃" "$EXPANDED" || true
          grep -F -m 5 "ぼっち・ざ・ろっく" "$EXPANDED" || true
          grep -F -m 5 "推しの子" "$EXPANDED" || true

      - name: Zero Query入力データを確認
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail

          test -s data/zero_query/zero_query.def
          test -s data/zero_query/zero_query_number.def
          test -s data_manager/oss/BUILD.bazel

          grep -n "zero_query_def" \
            data_manager/oss/BUILD.bazel

          grep -n "zero_query_number_def" \
            data_manager/oss/BUILD.bazel

          echo "zero_query.def:"
          wc -l -c data/zero_query/zero_query.def

          echo "zero_query_number.def:"
          wc -l -c data/zero_query/zero_query_number.def

          echo "Zero Query入力データを確認しました。"

      - name: 出力フォルダを作成
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/mozc-android-output"

      - name: Mozc辞書データをビルド
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail

          bazelisk build \
            //data_manager/oss:mozc_dataset_for_oss \
            --config release_build

          DATA_FILE="bazel-bin/data_manager/oss/mozc.data"

          test -s "$DATA_FILE"

          cp -L \
            "$DATA_FILE" \
            "$GITHUB_WORKSPACE/mozc-android-output/mozc.data"

          file "$DATA_FILE"
          ls -lh "$DATA_FILE"

      - name: Android用libmozc.soをビルド
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail

          bazelisk build \
            package \
            --config oss_android \
            --config release_build

          NATIVE_ZIP="bazel-bin/android/jni/native_libs.zip"

          test -s "$NATIVE_ZIP"

          cp -L \
            "$NATIVE_ZIP" \
            "$GITHUB_WORKSPACE/mozc-android-output/native_libs.zip"

      - name: ネイティブライブラリを展開
        shell: bash
        run: |
          set -euxo pipefail

          OUTPUT="$GITHUB_WORKSPACE/mozc-android-output"

          mkdir -p "$OUTPUT/native_libs"
          unzip -q \
            "$OUTPUT/native_libs.zip" \
            -d "$OUTPUT/native_libs"

          find "$OUTPUT/native_libs" \
            -type f \
            -name "libmozc.so" \
            -print \
            -exec file {} \; \
            -exec ls -lh {} \;

          LIBRARY_COUNT="$(
            find "$OUTPUT/native_libs" \
              -type f \
              -name "libmozc.so" \
              | wc -l
          )"

          test "$LIBRARY_COUNT" -gt 0

      - name: バージョンとライセンスを保存
        working-directory: mozc/src
        shell: bash
        run: |
          set -euxo pipefail

          OUTPUT="$GITHUB_WORKSPACE/mozc-android-output"
          MOZC_COMMIT_ID="$(git rev-parse HEAD)"
          MOZC_COMMIT_DATE="$(git log -1 --format='%cs')"
          MOZC_COMMIT_SUBJECT="$(git log -1 --format='%s')"
          SUDACHI_REPOSITORY="$GITHUB_WORKSPACE/mozcdic-ut-sudachidict"
          SUDACHI_COMMIT_ID="$(git -C "$SUDACHI_REPOSITORY" rev-parse HEAD)"
          SUDACHI_COMMIT_DATE="$(git -C "$SUDACHI_REPOSITORY" log -1 --format='%cs')"
          SUDACHI_COMMIT_SUBJECT="$(git -C "$SUDACHI_REPOSITORY" log -1 --format='%s')"

          {
            echo "Mozc requested ref:"
            echo "${{ inputs.mozc_ref }}"
            echo
            echo "Mozc commit:"
            echo "$MOZC_COMMIT_ID"
            echo
            echo "Mozc build source:"
            echo "$MOZC_COMMIT_ID"
            echo "$MOZC_COMMIT_DATE"
            echo "$MOZC_COMMIT_SUBJECT"
            echo
            echo "Sudachi dictionary requested ref:"
            echo "${{ inputs.sudachi_ref }}"
            echo
            echo "Sudachi dictionary commit:"
            echo "$SUDACHI_COMMIT_ID"
            echo
            echo "Sudachi dictionary source:"
            echo "$SUDACHI_COMMIT_ID"
            echo "$SUDACHI_COMMIT_DATE"
            echo "$SUDACHI_COMMIT_SUBJECT"
            echo
            echo "Sudachi dictionary repository:"
            echo "utuhiro78/mozcdic-ut-sudachidict"
            echo
            echo "Sudachi dictionary license:"
            echo "Apache License 2.0"
            echo
            echo "Dataset target:"
            echo "//data_manager/oss:mozc_dataset_for_oss"
            echo
            echo "Zero Query source:"
            echo "data/zero_query/zero_query.def"
            echo "data/zero_query/zero_query_number.def"
          } > "$OUTPUT/MOZC_BUILD_INFO.txt"

          cp ../LICENSE \
            "$OUTPUT/MOZC_LICENSE.txt"

          cp "$SUDACHI_REPOSITORY/LICENSE" \
            "$OUTPUT/SUDACHI_DICTIONARY_LICENSE.txt"

          cp data/zero_query/zero_query.def \
            "$OUTPUT/zero_query.def"

          cp data/zero_query/zero_query_number.def \
            "$OUTPUT/zero_query_number.def"

      - name: 成果物を検査
        shell: bash
        run: |
          set -euxo pipefail

          OUTPUT="$GITHUB_WORKSPACE/mozc-android-output"
          cd "$OUTPUT"

          test -s native_libs.zip
          test -s mozc.data
          test -s zero_query.def
          test -s zero_query_number.def
          test -s MOZC_BUILD_INFO.txt
          test -s MOZC_LICENSE.txt
          test -s SUDACHI_DICTIONARY_LICENSE.txt

          unzip -t native_libs.zip

          file mozc.data
          ls -lh \
            native_libs.zip \
            mozc.data \
            zero_query.def \
            zero_query_number.def

          sha256sum \
            native_libs.zip \
            mozc.data \
            zero_query.def \
            zero_query_number.def \
            MOZC_BUILD_INFO.txt \
            MOZC_LICENSE.txt \
            SUDACHI_DICTIONARY_LICENSE.txt \
            > SHA256SUMS.txt

          cat MOZC_BUILD_INFO.txt
          cat SHA256SUMS.txt

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v7
        with:
          name: mozc-android-sudachi-${{ github.run_number }}
          path: mozc-android-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
